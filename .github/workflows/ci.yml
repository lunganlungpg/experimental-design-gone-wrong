name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install numpy pandas scipy statsmodels matplotlib seaborn pytest
      - name: Python tests (data generators + statistical invariants)
        run: pytest -v
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Crime Lab stats engine tests
        run: node tests/js/stats.test.js
